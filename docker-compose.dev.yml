# 開発環境オーバーライド (VPS dev 用)
# docker compose -f docker-compose.yml -f docker-compose.dev.yml で使用
services:
  nginx:
    ports:
      - "19080:80"
    volumes:
      - ./nginx/conf.d/dev.conf:/etc/nginx/conf.d/default.conf
      # 本番用の certbot マウントを上書きして除外
      - /dev/null:/var/www/certbot
      - /dev/null:/etc/letsencrypt
